<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Acesso MR</title>
<style>
  :root { --fundo:#0b1620; --texto:#e8f4fa; --ciano:#4dd9ff; --suave:#9db4c0; }
  html,body { margin:0; height:100%; background:var(--fundo); color:var(--texto);
    font-family: system-ui, sans-serif; overflow:hidden; }
  #capa { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; padding:16px; text-align:center; z-index:2;
    pointer-events:none; }
  #capa > * { pointer-events:auto; }
  h1 { margin:0; font-size:22px; letter-spacing:.5px; }
  p { margin:0; color:var(--suave); max-width:420px; line-height:1.4; }
  button { font:inherit; font-size:18px; font-weight:700; padding:14px 28px; border-radius:12px;
    border:0; background:var(--ciano); color:#04202b; cursor:pointer; }
  button:disabled { background:#456; color:#9ab; cursor:default; }
  #status { font-size:14px; }
  #barra { position:fixed; left:0; right:0; bottom:0; display:none; gap:8px; justify-content:center;
    padding:12px 16px; z-index:3; flex-wrap:wrap; }
  #barra button { font-size:15px; padding:10px 16px; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="capa">
  <h1>CONTROLE DE ACESSO POR NFC</h1>
  <p>Realidade mista no navegador do Meta Quest. Toque em Entrar e coloque o kit na mesa.</p>
  <button id="entrar" disabled>Verificando...</button>
  <p id="status"></p>
  <button id="previa" style="background:#2a4250;color:#e8f4fa;font-size:15px">Ver no PC (sem óculos)</button>
</div>
<div id="barra">
  <button id="bLib">SIMULAR LIBERADO</button>
  <button id="bNeg" style="background:#ff6b6b">SIMULAR NEGADO</button>
</div>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js" } }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
